<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Donations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Admin Dashboard - Donations</h1>

        <h2>Donations Received</h2>
        <table>
            <thead>
                <tr>
                    <th>Donor Name</th>
                    <th>Food Item</th>
                    <th>Quantity (kg)</th>
                    <th>Contact</th>
                    <th>Pickup Address</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="donationList"></tbody>
        </table>

        <a href="index.html" class="back-link">Back to Home</a>
    </div>

    <script>
        function loadDonations() {
            const donations = JSON.parse(localStorage.getItem("donations")) || [];
            const donationList = document.getElementById("donationList");
            donationList.innerHTML = "";

            donations.forEach((donation, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${donation.donorName}</td>
                    <td>${donation.foodItem}</td>
                    <td>${donation.foodQuantity} kg</td>
                    <td>${donation.donorContact}</td>
                    <td>${donation.pickupAddress}</td>
                    <td>${donation.status || "Pending"}</td>
                    <td>
                        <button onclick="updateStatus(${index}, 'Accepted')">Accept</button>
                        <button onclick="updateStatus(${index}, 'Rejected')">Reject</button>
                    </td>
                `;
                donationList.appendChild(row);
            });
        }

        function updateStatus(index, newStatus) {
            const donations = JSON.parse(localStorage.getItem("donations")) || [];
            donations[index].status = newStatus;
            localStorage.setItem("donations", JSON.stringify(donations));
            loadDonations(); // Refresh table
        }

        window.onload = loadDonations;
    </script>

</body>
</html>
